<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Second World</title>
    <link href="/Home-FloatingHeader.css" rel="stylesheet" type="text/css" media="all">
    <link href="/Home-MainBody.css" rel="stylesheet" type="text/css" media="all">
    <link href="/Home-Scroll.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <script src="Progress_bar.js"></script>
  <script src="font_colors_script.js"></script> 

<body class=body>
  <!--potum gif-->
    <img src='resources/Potum-toram-nobg.webp' alt='Toram online mascott: Potum' class="PotumGiff">
    <!--Top floating nav-->
    <div class="MainHeader">
      <img src="resources/toram_ico.jpg" class="icon" alt="Toram Online icon" style="float:left;">
      <div class="flex-row">
        <a class="box" href="#about">
          <img src="resources/info page icon.png" class="contents">
          <span class="contents">Home</span>
        </a>
        <a class="box" href="#weaponclasses">
          <img src="resources/fighting page icon.png" class="contents">
          <span class="contents">Weapon Classes</span>
        </a>
        <a class="box" href="#world">
          <img src="resources/inventory icon.png" class="contents">
          <span class="contents">Game Systems</span>
        </a>
      </div>
    </div>
    <div class="image-container">
      <span id="levelUppercentage">......</span>
      <img id="levelUpProgress" src="resources/level up background.png" class="top-image">
      <img src="resources/level up gimp.png" class="fill-image">
    </div>
    <!--Main Body-->
    <div class="MainBody">
      <div class="scroll">
        <img src="resources/scroll.png" alt="Background scroll">
        <h1 class="head">Asobimo Toram Online</h1>
        <h2 class="head">A new path and a new adventure</h2>
      <ul class="scroll-list">
          <li>
            <a href="#about">
              <img src="resources/ui button.png" alt="Button"
                  onmouseover="this.src='resources/ui button hover.png'"
                  onmouseout="this.src='resources/ui button.png'">
              <span class="label">About</span>
            </a>
          </li>
          <li>
            <a href="#weapons">
              <img src="resources/ui button.png" alt="Button"
                  onmouseover="this.src='resources/ui button hover.png'"
                  onmouseout="this.src='resources/ui button.png'">
              <span class="label">Weapon Area</span>
            </a>
          </li>
          <li>
            <a href="#about">
              <img src="resources/ui button.png" alt="Button"
                  onmouseover="this.src='resources/ui button hover.png'"
                  onmouseout="this.src='resources/ui button.png'">
              <span class="label">About</span>
            </a>
          </li>
      </ul>
    </div>

    <footer>
    <p>
      <img src="resources/Asobimo_icon.jpeg" class="icon" style="float:left">
      Disclaimer! <br> We are in no way associated with Toram Online or Asobimo Games, just a solid fans.<br>
      <a href="https://asobimo.com/en/games/toram/">Visit the Asobimo site!</a>
    </p>
    </footer>

</body>
</html>
