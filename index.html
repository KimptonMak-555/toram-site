<body class=body>

    <div id="navbar"></div>

        <div id="Scroll-Contents">
          <h1 class="head reveal-text">Asobimo Toram Online</h1>

          <ul id="scroll-list">

                <a onclick="LoadDynamicComponent('about','About-Component/about.html')">

                </a>
              </li>
              <li>

              </li>
